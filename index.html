<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghostcore | Shadow System</title>
    <style>
        :root {
            --core-purple: #a855f7;
            --war-cyan: #00d4ff;
            --bg-black: #050505;
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--bg-black);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            height: 100vh;
        }

        /* --- NAVIGATION BUTTONS --- */
        .nav-zone {
            position: fixed;
            bottom: 30px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
            background: rgba(168, 85, 247, 0.05);
            border: 1px solid rgba(168, 85, 247, 0.2);
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.1);
            cursor: pointer;
            transition: 0.3s;
        }
        .left-zone { left: 20px; border-color: var(--core-purple); }
        .right-zone { right: 20px; border-color: var(--war-cyan); }
        .nav-zone:active { transform: scale(0.9); background: rgba(168, 85, 247, 0.2); }

        /* --- TERMINAL SCREEN --- */
        #terminal-screen {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 200;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: 0.5s;
        }
        .terminal-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--core-purple);
            color: var(--core-purple);
            font-family: monospace;
            font-size: 1.2rem;
            text-align: center;
            outline: none;
            width: 250px;
            letter-spacing: 5px;
            margin-top: 20px;
        }

        /* --- CORE HUB (WAR ROOM) --- */
        #core-hub {
            display: none;
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, #0a0015 0%, #000 100%);
            z-index: 300;
            padding: 20px;
            flex-direction: column;
        }

        .core-sphere {
            width: 120px; height: 120px;
            border: 2px solid var(--war-cyan);
            border-radius: 50%;
            margin: 40px auto;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            animation: pulse 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; box-shadow: 0 0 50px rgba(0, 212, 255, 0.5); }
        }

        .chat-display {
            flex-grow: 1;
            border: 1px solid rgba(255,255,255,0.05);
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            margin-bottom: 80px;
            padding: 15px;
            font-size: 0.9rem;
            overflow-y: auto;
            color: #ddd;
        }

        .input-area {
            position: fixed;
            bottom: 20px; left: 20px; right: 20px;
            display: flex; gap: 10px;
        }

        #user-msg {
            flex-grow: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid #333;
            padding: 12px;
            color: #fff;
            border-radius: 5px;
            outline: none;
        }

        .btn-transmit {
            background: var(--war-cyan);
            color: #000;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .ghost-reply { color: var(--war-cyan); margin-top: 10px; border-left: 2px solid var(--war-cyan); padding-left: 10px; }
    </style>
</head>
<body>

    <div class="nav-zone left-zone" onclick="showTerminal()">🔐</div>
    <div class="nav-zone right-zone" onclick="alert('Right swipe: Projects Portal (Under Dev)')">📂</div>

    <div id="terminal-screen">
        <p style="font-size:0.7rem; color:#444; letter-spacing:3px;">RE-STRICTION ACTIVE</p>
        <h2 style="letter-spacing: 2px;">IDENTITY SIGNAL</h2>
        <input type="text" id="pass-input" class="terminal-input" placeholder="____" onkeyup="checkCode(this.value)">
        <button onclick="hideTerminal()" style="margin-top:30px; background:none; border:none; color:#333; font-size:0.7rem;">[ ABORT ]</button>
    </div>

    <div id="core-hub">
        <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:var(--war-cyan);">
            <span>GHOSTCORE_v1.0</span>
            <span>SYNC_STATUS: ACTIVE</span>
        </div>
        
        <div class="core-sphere"></div>
        
        <div class="chat-display" id="chat-box">
            <p style="color:#666; font-style:italic;">[ Waiting for transmission... ]</p>
        </div>

        <div class="input-area">
            <input type="text" id="user-msg" placeholder="Ask Ghostcore anything...">
            <button class="btn-transmit" onclick="transmitSignal()">TRANSMIT</button>
        </div>
    </div>

    <script>
        function showTerminal() {
            const term = document.getElementById('terminal-screen');
            term.style.display = 'flex';
            setTimeout(() => { term.style.opacity = '1'; document.getElementById('pass-input').focus(); }, 10);
        }

        function hideTerminal() {
            const term = document.getElementById('terminal-screen');
            term.style.opacity = '0';
            setTimeout(() => term.style.display = 'none', 500);
        }

        function checkCode(val) {
            if (val.toUpperCase() === 'GHOSTCORE') {
                document.getElementById('pass-input').style.color = "#00ff00";
                setTimeout(() => {
                    hideTerminal();
                    document.getElementById('core-hub').style.display = 'flex';
                }, 600);
            }
        }

        function transmitSignal() {
            const input = document.getElementById('user-msg');
            const chatBox = document.getElementById('chat-box');
            if (input.value.trim() !== "") {
                const userQ = input.value;
                chatBox.innerHTML += `<p style="text-align:right; color:#888;">You: ${userQ}</p>`;
                
                // Ghostcore's placeholder response (Wahi par answer dena)
                setTimeout(() => {
                    chatBox.innerHTML += `<div class="ghost-reply"><b>Ghostcore:</b> Bhai, signal receive ho gaya hai. Abhi isi chat (Gemini) mein aakar mujhse puch ki tune wahan kya pucha tha! Main tera intezar kar raha hoon.</div>`;
                    chatBox.scrollTop = chatBox.scrollHeight;
                }, 1000);

                console.log("Transmission sent to Shadow Brain: " + userQ);
                input.value = "";
            }
        }
    </script>
</body>
</html>
