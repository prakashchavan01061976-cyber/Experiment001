<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHOSTCORE // FINAL SYNC</title>
    <style>
        :root { --primary: #7000ff; --bg: #050505; --text: #e0e0e0; }
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        #console { width: 90%; max-width: 450px; background: rgba(15,15,15,0.9); border: 1px solid var(--primary); border-radius: 20px; padding: 25px; box-shadow: 0 0 30px rgba(112,0,255,0.2); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .status { font-size: 12px; color: #00ff00; letter-spacing: 1px; }
        textarea { width: 100%; height: 100px; background: #111; border: 1px solid #444; border-radius: 10px; color: #fff; padding: 12px; box-sizing: border-box; outline: none; margin-bottom: 15px; }
        button { width: 100%; padding: 15px; background: var(--primary); border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; letter-spacing: 2px; transition: 0.3s; }
        button:hover { background: #5500cc; transform: translateY(-2px); }
    </style>
</head>
<body>

<div id="console">
    <div class="header">
        <span style="font-weight: bold; color: var(--primary);">GHOSTCORE SYSTEM</span>
        <span class="status" id="status-text">● SECURE LINK ACTIVE</span>
    </div>

    <textarea id="msg-input" placeholder="Enter signal for Shadow..."></textarea>
    <button onclick="sendToShadow()" id="sync-btn">TRANSMIT TO CORE</button>
    
    <p style="font-size: 10px; text-align: center; color: #555; margin-top: 15px;">ENCRYPTED VIA API: AIzaSyB...6nXE</p>
</div>

<script>
// Final Configuration
const CONFIG = {
    apiKey: "AIzaSyBkYDT3CZI9qiubTA55QYKNPLh9Eus6nXE",
    dbUrl: "https://ghostcore-shadow-default-rtdb.firebaseio.com/signals.json"
};

async function sendToShadow() {
    const input = document.getElementById('msg-input');
    const btn = document.getElementById('sync-btn');
    const status = document.getElementById('status-text');
    
    if(!input.value) return;

    btn.innerText = "TUNNELING...";
    status.innerText = "○ ESTABLISHING HANDSHAKE";

    try {
        const response = await fetch(CONFIG.dbUrl, {
            method: 'POST',
            body: JSON.stringify({
                message: input.value,
                timestamp: new Date().toISOString(),
                auth: "VERIFIED_CREATOR"
            })
        });

        if(response.ok) {
            status.innerText = "● TRANSMISSION SUCCESS";
            btn.innerText = "DATA LOCKED";
            input.value = "";
            
            setTimeout(() => {
                btn.innerText = "TRANSMIT TO CORE";
                alert("Bhai, signal Core mein save ho gaya hai! Ab yahan chat mein aakar mujhse mera 'Shadow Word' puch!");
            }, 1000);
        }
    } catch (e) {
        status.innerText = "X CONNECTION ERROR";
        btn.innerText = "RETRY";
    }
}
</script>

</body>
</html>
