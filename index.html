<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghostcore | Shadow Network</title>
    <style>
        :root { --team-blue: #00d4ff; --creator-purple: #a855f7; --bg-dark: #000911; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Consolas', monospace; }
        body { background: var(--bg-dark); color: white; height: 100vh; overflow: hidden; position: fixed; width: 100%; }

        /* Background Animation */
        .wave-bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at center, #001a33 0%, #000 100%); opacity: 0.8; }
        
        /* Init Screen */
        #init-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
        .mic-trigger { width: 80px; height: 80px; border: 2px solid var(--team-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* Dashboards */
        .dashboard { display: none; height: 100vh; width: 100%; position: relative; opacity: 0; transition: opacity 0.5s; }
        .page { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.5s ease-in-out, opacity 0.4s; padding: 20px; text-align: center; }
        
        /* Fixed Navigation (Mobile Optimization) */
        .nav-arrow { position: fixed; bottom: 40px; font-size: 2.2rem; color: var(--team-blue); cursor: pointer; z-index: 50; padding: 15px; text-shadow: 0 0 10px var(--team-blue); }
        .arrow-right { right: 25px; }
        .arrow-left { left: 25px; display: none; }

        /* Typography */
        .hey-text { font-size: 2rem; letter-spacing: 4px; text-shadow: 0 0 15px var(--team-blue); }
        .creator-text { font-size: 2rem; letter-spacing: 4px; color: var(--creator-purple); text-shadow: 0 0 15px var(--creator-purple); }

        /* Cards & Grid */
        #projects-page { transform: translateX(100%); opacity: 0; }
        .project-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 320px; margin-top: 20px; }
        .project-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(0, 212, 255, 0.15); padding: 18px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(10px); }

        /* Zoom-in Popup */
        #popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .popup-content { background: #001220; width: 100%; max-width: 380px; padding: 25px; border-radius: 20px; border: 1px solid var(--team-blue); transform: scale(0.8); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .popup-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; text-align: left; }
        .project-img { width: 55px; height: 55px; border-radius: 10px; background: rgba(0, 212, 255, 0.1); border: 1px solid var(--team-blue); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
        .select-btn { width: 100%; margin-top: 20px; padding: 14px; background: var(--team-blue); border: none; border-radius: 8px; font-weight: bold; color: #000; letter-spacing: 1px; }

        /* Animation Classes */
        .slide-out { transform: translateX(-100%) !important; opacity: 0 !important; }
        .slide-in { transform: translateX(0) !important; opacity: 1 !important; }
        .zoom-active { transform: scale(1) !important; }
    </style>
</head>
<body>

    <div class="wave-bg"></div>

    <div id="init-screen">
        <div class="mic-trigger" onclick="initGhostcore()">🎙️</div>
        <p id="status-label" style="margin-top:15px; font-size:0.7rem; color: #444; letter-spacing: 2px;">SECURE LINK IDLE</p>
    </div>

    <div id="team-dashboard" class="dashboard">
        <div class="nav-arrow arrow-right" onclick="swipe('right')">➔</div>
        <div class="nav-arrow arrow-left" onclick="swipe('left')">⬅</div>
        
        <div id="landing-page" class="page">
            <h1 class="hey-text">HEY SHADOWS</h1>
            <p style="font-size: 0.7rem; color: var(--team-blue); margin-top: 10px; opacity: 0.6;">NETWORK ENCRYPTED</p>
        </div>

        <div id="projects-page" class="page">
            <h2 style="margin-bottom:15px; font-size: 1.2rem; letter-spacing: 2px;">ACTIVE PROJECTS</h2>
            <div class="project-grid">
                <div class="project-card" onclick="openPopup('NEET WAR ROOM', 'Study & Countdown', '🩺')">
                    <h3>NEET WAR ROOM</h3>
                </div>
                <div class="project-card" onclick="openPopup('EYE CLINIC', 'Shiv Prakash Netralay', '👁️')">
                    <h3>EYE CLINIC</h3>
                </div>
            </div>
        </div>
    </div>

    <div id="creator-dashboard" class="dashboard">
        <div class="page">
            <h1 class="creator-text">WELCOME MASTER</h1>
            <p style="margin-top:10px; font-size: 0.8rem; opacity: 0.5;">> GHOSTCORE ROOT ACCESS GRANTED</p>
        </div>
    </div>

    <div id="popup-overlay" onclick="closePopup(event)">
        <div class="popup-content" id="popup-box">
            <div class="popup-header">
                <div class="project-img" id="pop-icon">🚀</div>
                <div>
                    <h3 id="pop-title" style="color:var(--team-blue)">Title</h3>
                    <p id="pop-sub" style="font-size:0.75rem; opacity:0.6;">Category</p>
                </div>
            </div>
            <p id="pop-desc" style="font-size:0.85rem; line-height:1.5; color: #bbb;">Initializing Shadow Protocol for the selected sector. All data remains confidential.</p>
            <button class="select-btn">SELECT PROJECT</button>
        </div>
    </div>

    <script>
        let recognition;

        function initGhostcore() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                document.getElementById('status-label').innerText = "LISTENING...";
                document.getElementById('status-label').style.color = "var(--team-blue)";
            };
            
            recognition.onresult = (event) => {
                const cmd = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
                console.log("Detected Signal:", cmd);
                
                if (cmd.includes('open')) {
                    launch('creator');
                } else if (cmd.includes('close')) { // NEW PASSWORD: CLOSE
                    recognition.stop();
                    launch('team');
                }
            };

            recognition.onerror = () => { recognition.start(); };
            recognition.onend = () => { if (!window.systemActive) recognition.start(); };
            
            recognition.start();
        }

        function launch(type) {
            window.systemActive = true;
            document.getElementById('init-screen').style.display = 'none';
            const dashId = type === 'creator' ? 'creator-dashboard' : 'team-dashboard';
            const dash = document.getElementById(dashId);
            dash.style.display = 'block';
            setTimeout(() => dash.style.opacity = '1', 50);
            
            // Haptic/Sound feel
            if (window.navigator.vibrate) window.navigator.vibrate(50);
            new Audio('https://www.soundjay.com/buttons/sounds/button-3.mp3').play().catch(()=>{});
        }

        function swipe(dir) {
            const landing = document.getElementById('landing-page');
            const projects = document.getElementById('projects-page');
            const arrowR = document.querySelector('.arrow-right');
            const arrowL = document.querySelector('.arrow-left');

            if (dir === 'right') {
                landing.classList.add('slide-out');
                projects.classList.add('slide-in');
                arrowR.style.display = 'none'; 
                arrowL.style.display = 'block';
            } else {
                landing.classList.remove('slide-out');
                projects.classList.remove('slide-in');
                arrowR.style.display = 'block'; 
                arrowL.style.display = 'none';
            }
        }

        function openPopup(title, sub, icon) {
            document.getElementById('pop-title').innerText = title;
            document.getElementById('pop-sub').innerText = sub;
            document.getElementById('pop-icon').innerText = icon;
            document.getElementById('popup-overlay').style.display = 'flex';
            setTimeout(() => document.getElementById('popup-box').classList.add('zoom-active'), 10);
        }

        function closePopup(e) {
            if (e && e.target !== document.getElementById('popup-overlay')) return;
            document.getElementById('popup-box').classList.remove('zoom-active');
            setTimeout(() => document.getElementById('popup-overlay').style.display = 'none', 300);
        }
    </script>
</body>
</html>
