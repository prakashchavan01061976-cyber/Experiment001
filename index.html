<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghostcore | Shadow Network</title>
    <style>
        :root { --team-blue: #00d4ff; --creator-purple: #a855f7; --bg-dark: #000911; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-dark); color: white; height: 100vh; overflow: hidden; position: fixed; width: 100%; }

        /* Liquid Background */
        .wave-bg { position: fixed; inset: 0; z-index: -1; background: radial-gradient(circle at center, #001a33 0%, #000 100%); opacity: 0.8; }
        
        /* Init Screen */
        #init-screen { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
        .mic-trigger { width: 80px; height: 80px; border: 2px solid var(--team-blue); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; cursor: pointer; box-shadow: 0 0 15px rgba(0, 212, 255, 0.3); animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* General Dashboard Container */
        .dashboard { display: none; height: 100vh; width: 100%; position: relative; opacity: 0; transition: opacity 0.5s; }
        .page { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s; padding: 20px; text-align: center; }
        
        /* Navigation Arrows (Responsive Fix) */
        .nav-arrow { position: fixed; bottom: 30px; font-size: 2.5rem; color: var(--team-blue); cursor: pointer; z-index: 10; padding: 10px; }
        .arrow-right { right: 20px; }
        .arrow-left { left: 20px; display: none; }

        /* Panels */
        .hey-text { font-size: 2.2rem; letter-spacing: 5px; text-shadow: 0 0 15px var(--team-blue); }
        .creator-text { font-size: 2.2rem; letter-spacing: 5px; text-shadow: 0 0 15px var(--creator-purple); color: var(--creator-purple); }

        /* Project Cards */
        #projects-page { transform: translateX(100%); opacity: 0; }
        .project-grid { display: flex; flex-direction: column; gap: 15px; width: 100%; max-width: 350px; margin-top: 20px; }
        .project-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(0, 212, 255, 0.2); padding: 15px; border-radius: 12px; cursor: pointer; backdrop-filter: blur(5px); }

        /* Popup Scaling Fix */
        #popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
        .popup-content { background: #001220; width: 100%; max-width: 400px; padding: 25px; border-radius: 20px; border: 2px solid var(--team-blue); transform: scale(0.8); transition: 0.3s ease-out; }
        .popup-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .project-img { width: 60px; height: 60px; border-radius: 10px; background: var(--team-blue); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
        .select-btn { width: 100%; margin-top: 20px; padding: 12px; background: var(--team-blue); border: none; border-radius: 8px; font-weight: bold; }

        /* State Classes */
        .slide-out { transform: translateX(-100%) !important; opacity: 0 !important; }
        .slide-in { transform: translateX(0) !important; opacity: 1 !important; }
        .zoom-active { transform: scale(1) !important; }
    </style>
</head>
<body>

    <div class="wave-bg"></div>

    <div id="init-screen">
        <div class="mic-trigger" onclick="initGhostcore()">🎙️</div>
        <p id="status-label" style="margin-top:15px; font-size:0.8rem; color: #555;">IDLE MODE</p>
    </div>

    <div id="team-dashboard" class="dashboard">
        <div class="nav-arrow arrow-right" onclick="swipe('right')">➔</div>
        <div class="nav-arrow arrow-left" onclick="swipe('left')">⬅</div>
        <div id="landing-page" class="page"><h1 class="hey-text">HEY SHADOWS</h1></div>
        <div id="projects-page" class="page">
            <h2 style="margin-bottom:10px;">PROJECTS</h2>
            <div class="project-grid">
                <div class="project-card" onclick="openPopup('NEET WAR ROOM', 'Study Tracker', '🩺')"><h3>NEET WAR ROOM</h3></div>
                <div class="project-card" onclick="openPopup('EYE CLINIC', 'Shiv Prakash Netralay', '👁️')"><h3>EYE CLINIC</h3></div>
            </div>
        </div>
    </div>

    <div id="creator-dashboard" class="dashboard">
        <div class="page"><h1 class="creator-text">WELCOME MASTER</h1><p>> All Systems Operational</p></div>
    </div>

    <div id="popup-overlay" onclick="closePopup(event)">
        <div class="popup-content" id="popup-box">
            <div class="popup-header">
                <div class="project-img" id="pop-icon">🚀</div>
                <div><h3 id="pop-title" style="color:var(--team-blue)">Title</h3><p id="pop-sub" style="font-size:0.8rem; opacity:0.7;">Sub</p></div>
            </div>
            <p id="pop-desc" style="font-size:0.9rem; line-height:1.4;">Accessing Shadow Database...</p>
            <button class="select-btn">SELECT PROJECT</button>
        </div>
    </div>

    <script>
        let recognition;

        function initGhostcore() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.onstart = () => document.getElementById('status-label').innerText = "LISTENING...";
            
            recognition.onresult = (event) => {
                const cmd = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
                console.log("Detected:", cmd);
                
                if (cmd.includes('open')) {
                    launch('creator');
                } else if (cmd.includes('off')) { // Password changed to 'OFF'
                    recognition.stop();
                    launch('team');
                }
            };
            recognition.start();
        }

        function launch(type) {
            document.getElementById('init-screen').style.display = 'none';
            const dashId = type === 'creator' ? 'creator-dashboard' : 'team-dashboard';
            const dash = document.getElementById(dashId);
            dash.style.display = 'block';
            setTimeout(() => dash.style.opacity = '1', 50);
        }

        function swipe(dir) {
            const landing = document.getElementById('landing-page');
            const projects = document.getElementById('projects-page');
            const arrowR = document.querySelector('.arrow-right');
            const arrowL = document.querySelector('.arrow-left');

            if (dir === 'right') {
                landing.classList.add('slide-out');
                projects.classList.add('slide-in');
                arrowR.style.display = 'none'; arrowL.style.display = 'block';
            } else {
                landing.classList.remove('slide-out');
                projects.classList.remove('slide-in');
                arrowR.style.display = 'block'; arrowL.style.display = 'none';
            }
        }

        function openPopup(title, sub, icon) {
            document.getElementById('pop-title').innerText = title;
            document.getElementById('pop-sub').innerText = sub;
            document.getElementById('pop-icon').innerText = icon;
            document.getElementById('popup-overlay').style.display = 'flex';
            setTimeout(() => document.getElementById('popup-box').classList.add('zoom-active'), 10);
        }

        function closePopup(e) {
            if (e && e.target !== document.getElementById('popup-overlay')) return;
            document.getElementById('popup-box').classList.remove('zoom-active');
            setTimeout(() => document.getElementById('popup-overlay').style.display = 'none', 300);
        }
    </script>
</body>
</html>
